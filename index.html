<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nós Dois</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #fff);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.principal {
  width: 100%;
  max-width: 480px;
}

.cartao {
  background: white;
  border-radius: 25px;
  padding: 35px 25px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.12);
}

.coracoes {
  font-size: 48px;
}

h1 {
  color: #d83b78;
  font-size: 38px;
  margin: 10px 0;
}

.subtitulo {
  color: #555;
  font-size: 18px;
  line-height: 1.5;
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: #d83b78;
  color: white;
  font-size: 18px;
  font-weight: bold;
  margin-top: 12px;
}

button.secundario {
  background: white;
  color: #d83b78;
  border: 2px solid #d83b78;
}

#partida {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #fff0f6;
  border-radius: 18px;
}

.codigo {
  font-size: 32px;
  font-weight: bold;
  color: #d83b78;
  letter-spacing: 6px;
  margin: 12px 0;
}

.informacoes {
  margin-top: 25px;
  color: #777;
  font-size: 15px;
  line-height: 1.8;
}
</style>
</head>

<body>

<main class="principal">

<section class="cartao">

<div class="coracoes">💕</div>

<h1>Nós Dois</h1>

<div class="subtitulo">
Será que você realmente conhece quem está ao seu lado?
</div>

<button onclick="criarPartida()">
Criar partida
</button>

<button class="secundario" onclick="entrarPartida()">
Entrar com código
</button>

<div id="partida">
  <strong>Sua partida foi criada! ❤️</strong>

  <div>Compartilhe este código:</div>

  <div class="codigo" id="codigo"></div>

  <div>Envie o código para a outra pessoa.</div>
</div>

<div class="informacoes">
❤️ 15 perguntas sobre vocês<br>
💕 Cada um responde sobre si mesmo<br>
💖 Descubra o quanto vocês se conhecem
</div>

</section>

</main>

<script>

function criarPartida() {

  const codigo = Math.floor(100000 + Math.random() * 900000);

  document.getElementById("codigo").textContent = codigo;

  document.getElementById("partida").style.display = "block";
}

function entrarPartida() {

  const codigo = prompt("Digite o código da partida:");

  if (codigo) {
    alert("Código recebido: " + codigo);
  }

}

</script>

</body>
</html>
