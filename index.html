<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nós Dois ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#ffe8ee;color:#333}
.card{max-width:600px;margin:auto;background:white;padding:25px;border-radius:22px;box-shadow:0 4px 20px #0001}
h1,h2{text-align:center;color:#d6285c}
input[type=text],input:not([type]){width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;background:#e83267;color:white}
.secondary{background:#eee;color:#333}
.whatsapp{background:#25D366;color:white}
.hidden{display:none}
.question{font-size:20px;font-weight:bold;margin:25px 0 15px}
label{display:block;padding:13px;margin:8px 0;background:#fff3f6;border-radius:10px}
.code{text-align:center;font-size:30px;font-weight:bold;letter-spacing:5px}
a{color:#c51f50;overflow-wrap:anywhere}
.linkbox{margin-top:20px;padding:15px;background:#fff3f6;border-radius:10px;overflow-wrap:anywhere}
.small{text-align:center;color:#777;font-size:13px}
</style>
</head>
<body>
<div class="card">

<section id="inicio">
<h1>❤️ Nós Dois ❤️</h1>
<p style="text-align:center">Descubra o quanto vocês se conhecem!</p>
<input id="nome1" placeholder="Seu nome">
<input id="nome2" placeholder="Nome da outra pessoa">
<button onclick="iniciar()">Começar o quiz</button>
</section>

<section id="quiz" class="hidden">
<h2 id="contador"></h2>
<div id="pergunta"></div>
<button onclick="proxima()">Próxima pergunta</button>
</section>

<section id="resultado" class="hidden">
<h1>Resultado ❤️</h1>
<p id="textoResultado"></p>
<div id="porcentagem" style="font-size:55px;text-align:center;color:#d6285c;font-weight:bold"></div>
<p id="mensagem" style="text-align:center"></p>
<p style="text-align:center">Código da partida:</p>
<div class="code" id="codigo"></div>
<button class="whatsapp" onclick="compartilhar()">Compartilhar no WhatsApp</button>
<button class="secondary" onclick="copiar()">Copiar link da partida</button>
<div class="linkbox">
<strong>🔗 Entre aqui para jogar:</strong><br>
<a id="linkJogo" href="#"></a>
</div>
<button class="secondary" onclick="location.href=location.pathname">Jogar novamente</button>
</section>

<section id="convite" class="hidden">
<h1>❤️ Nós Dois ❤️</h1>
<p>Você recebeu um convite para jogar!</p>
<p>Código da partida:</p>
<div class="code" id="codigoConvite"></div>
<p>Para participar, abra o Nós Dois e informe o código ao seu parceiro.</p>
</section>

</div>

<script>
const perguntas=[
"O que mais faz essa pessoa rir?",
"Qual comida essa pessoa mais gosta?",
"O que mais deixa essa pessoa feliz?",
"O que costuma deixar essa pessoa triste?",
"Qual é o maior sonho dessa pessoa?",
"Qual lugar ela gostaria de conhecer?",
"Qual é uma qualidade marcante dessa pessoa?",
"O que ela poderia melhorar?",
"O que gosta de fazer no tempo livre?",
"Qual presente deixaria essa pessoa feliz?",
"Qual estilo musical combina com ela?",
"O que mais irrita essa pessoa?",
"Qual bebida ela escolheria?",
"Onde gostaria de passar um fim de semana?",
"O que ela mais valoriza em um relacionamento?"
];

let atual=0;
let pontos=0;
let nome1="";
let nome2="";
let codigo="";

function novoCodigo(){
 const letras="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 let resultado="";
 for(let i=0;i<6;i++){
  resultado+=letras[Math.floor(Math.random()*letras.length)];
 }
 return resultado;
}

/* IMPORTANTE:
   O convite usa o endereço público do site.
   Não usa o caminho local content://downloads do celular. */
function enderecoBase(){
 return "https://noisdois-app-2026.netlify.app";
}

function enderecoJogo(){
 return enderecoBase()+"/?partida="+encodeURIComponent(codigo);
}

function iniciar(){
 nome1=document.getElementById("nome1").value.trim()||"Jogador 1";
 nome2=document.getElementById("nome2").value.trim()||"Jogador 2";
 codigo=novoCodigo();
 atual=0;
 pontos=0;
 document.getElementById("inicio").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 mostrarPergunta();
}

function mostrarPergunta(){
 document.getElementById("contador").textContent=
 "Pergunta "+(atual+1)+" de "+perguntas.length;

 document.getElementById("pergunta").innerHTML=
 '<div class="question">'+perguntas[atual]+'</div>'+
 '<label><input type="radio" name="resposta" value="1"> Sim, com certeza</label>'+
 '<label><input type="radio" name="resposta" value="1"> Provavelmente</label>'+
 '<label><input type="radio" name="resposta" value="0"> Não sei</label>'+
 '<label><input type="radio" name="resposta" value="0"> Provavelmente não</label>';
}

function proxima(){
 const resposta=document.querySelector('input[name="resposta"]:checked');
 if(!resposta){
  alert("Escolha uma resposta antes de continuar.");
  return;
 }
 if(resposta.value==="1") pontos++;
 atual++;
 if(atual<perguntas.length){
  mostrarPergunta();
 }else{
  mostrarResultado();
 }
}

function mostrarResultado(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("resultado").classList.remove("hidden");

 const percentual=Math.round(pontos/perguntas.length*100);
 document.getElementById("textoResultado").textContent=
 nome1+" fez o quiz sobre "+nome2+".";
 document.getElementById("porcentagem").textContent=percentual+"%";
 document.getElementById("codigo").textContent=codigo;

 let mensagem="Ainda dá para descobrir muito mais um sobre o outro! 😅";
 if(percentual>=80) mensagem="Vocês se conhecem muito bem! ❤️";
 else if(percentual>=60) mensagem="Mandaram bem! 😍";
 else if(percentual>=40) mensagem="Nada mal! Continuem se conhecendo! 😉";

 document.getElementById("mensagem").textContent=mensagem;

 const link=enderecoJogo();
 const elemento=document.getElementById("linkJogo");
 elemento.href=link;
 elemento.textContent=link;
}

function compartilhar(){
 const percentual=Math.round(pontos/perguntas.length*100);
 const link=enderecoJogo();

 const mensagem=
 "❤️ Nós Dois ❤️\n\n"+
 nome1+" fez o quiz sobre "+nome2+"!\n"+
 "Acertou "+percentual+"% das perguntas.\n\n"+
 "🎮 ENTRE AQUI PARA JOGAR:\n"+
 link+"\n\n"+
 "🔑 Código da partida: "+codigo;

 window.location.href="https://wa.me/?text="+encodeURIComponent(mensagem);
}

async function copiar(){
 const link=enderecoJogo();
 try{
  await navigator.clipboard.writeText(link);
  alert("Link copiado! Agora cole no WhatsApp.");
 }catch(e){
  prompt("Copie o link abaixo:",link);
 }
}

const parametros=new URLSearchParams(window.location.search);
const convite=parametros.get("partida");

if(convite){
 document.getElementById("inicio").classList.add("hidden");
 document.getElementById("convite").classList.remove("hidden");
 document.getElementById("codigoConvite").textContent=convite;
}
</script>
</body>
</html>
